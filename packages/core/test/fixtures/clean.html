<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Your order has shipped</title>
  <style>
    body { margin: 0; padding: 0; }
    @media (prefers-color-scheme: dark) {
      .bg-body { background-color: #121212 !important; }
      .text { color: #f1f1f1 !important; }
    }
  </style>
</head>
<body class="bg-body" style="margin:0; padding:0; background-color:#f4f4f4;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
          <tr>
            <td style="padding:24px;">
              <img src="https://cdn.example.com/brand/logo.png" width="140" height="40" alt="Example Store" style="display:block; border:0;">
            </td>
          </tr>
          <tr>
            <td class="text" style="padding:0 24px 24px; font-family:Arial, sans-serif; font-size:16px; line-height:24px; color:#222222;">
              <p style="margin:0 0 16px;">Hi %%FirstName%%, your order is on its way.</p>
              <a href="https://example.com/orders/track?id=%%OrderId%%" style="color:#0b57d0;">Track your package</a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px; font-family:Arial, sans-serif; font-size:12px; color:#666666;">
              <a href="#SPCUNSUBSCRIBE#" style="color:#666666;">Unsubscribe</a> |
              <a href="mailto:support@example.com" style="color:#666666;">Contact support</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
